{% extends "base.html" %}

{% block title %}403 - 禁止访问{% endblock %}

{% block content %}
<section class="card">
    <h2>403 禁止访问</h2>
    <p>你没有权限执行该操作。</p>
    {% if app_env == "production" %}
    <p class="tip">提示：线上环境下，“重置数据库”需要提供正确的 `RESET_TOKEN`。</p>
    {% endif %}
    <p><a class="button-link" href="{{ url_for('index') }}">返回首页</a></p>
</section>
{% endblock %}
