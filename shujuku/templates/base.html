<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}校园二手交易平台数据库系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>校园二手交易平台数据库系统</h1>
            <nav class="nav">
                <a href="{{ url_for('index') }}">首页</a>
                <a href="{{ url_for('items') }}">商品列表</a>
                <a href="{{ url_for('users') }}">用户列表</a>
                <a href="{{ url_for('orders') }}">订单列表</a>
                <a href="{{ url_for('queries') }}">查询与视图</a>
                <a href="{{ url_for('report') }}">说明页</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <section class="flash-list">
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </section>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <footer class="container">
        <p class="tip">请求追踪 ID：{{ request_id }}</p>
    </footer>
</body>
</html>
