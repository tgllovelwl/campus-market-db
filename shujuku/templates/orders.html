{% extends "base.html" %}

{% block title %}订单列表{% endblock %}

{% block content %}
<section class="card">
    <h2>订单列表</h2>
    <table>
        <thead>
            <tr>
                <th>订单 ID</th>
                <th>商品名</th>
                <th>买家</th>
                <th>卖家</th>
                <th>订单日期</th>
            </tr>
        </thead>
        <tbody>
            {% for order in orders %}
            <tr>
                <td>{{ order.order_id }}</td>
                <td>{{ order.item_name }}</td>
                <td>{{ order.buyer_name }}</td>
                <td>{{ order.seller_name }}</td>
                <td>{{ order.order_date }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
